ingest:
  dpi: 300
  page_timeout_seconds: 30
  fail_on_parse_error: false
  debug_save_page_rasters: false

classify:
  confidence_threshold: 0.75
  metadata_field_patterns:
    - "Question Id"
    - "Question Number"
    - "Question Type"
    - "Question Label"
    - "Correct Marks"
    - "Negative Marks"
    - "Response Type"
    - "Answers Type"
    - "Possible Answers"
    - "Answer Range"
    - "Evaluation Required For SA"
    - "Sub Question Shuffling Allowed"
    - "Group Comprehension Questions"
    - "Question Numbers"
    - "Question Pattern Type"
    - "Section"

extract:
  vlm_model_id: "ibm-granite/granite-vision-4.1-4b"
  vlm_device: "cuda"
  vlm_max_new_tokens: 1024
  math_crop_padding_px: 8
  figure_crop_padding_px: 12
  always_save_math_crops: true
  always_save_figure_crops: true

stitch:
  max_lookahead_pages: 2
  truncation_sentinel_keys:
    - "Possible Answers"
    - "Answer Range"

validate:
  warn_on_missing_correct_option: true
  warn_on_empty_sub_questions: true
  latex_balance_check: true
  matrix_dimension_check: true
  min_mcq_options: 2
  max_mcq_options: 6

assemble:
  json_indent: 2
  ensure_ascii: false
  run_schema_validation: true

render:
  katex_cdn: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist"
  katex_local_fallback: "./assets/katex"
  include_review_warnings: true
  md_math_delimiter: "$$"

output:
  base_dir: "./output"
  assets_subdir: "assets"
  figures_subdir: "assets/figures"
  math_crops_subdir: "assets/math_crops"
  option_crops_subdir: "assets/option_crops"
